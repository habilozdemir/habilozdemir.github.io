<!DOCTYPE html>
<html lang="{{ site.lang | default: 'tr' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title %}
      <h1><a href="{{ '/' | absolute_url }}">{{ site.title }}</a></h1>
      {% endif %}

      {{ content }}

      {% unless page.url contains 'yasal-uyari' %}
      <footer class="border-top border-gray-light mt-5 pt-3 text-right text-gray f6">
        <a href="{{ '/yasal-uyari.html' | relative_url }}">Yasal Uyarı ve Sorumluluk Reddi</a>
      </footer>
      {% endunless %}
    </div>
  </body>
</html>
